name: neuroswift
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - mne
  - scikit-learn
  - pytorch
  - torchvision
  - pip
  - pip:
      - streamlit>=1.28
      - plotly>=5.15
      - pyedflib
      - tqdm
      - joblib
      - pyyaml
      - huggingface-hub
      - opencv-python-headless
      - Pillow
